<title>Circle of Fifths Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Music&family=Young+Serif&display=swap">
<style>
/* Layout: one reading column; language bar on top; circle + key card side by side on wide screens, stacked on phones; two keyboards below, glossary last */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --fg:#17201B; --muted:#56615A; --line:#D7DCD6;
  --accent:#1C6A50; --accent-soft:#D3EBDF; --accent-ink:#0E3B2C; --on-accent:#FFFFFF;
  --flat:#5B4BC4; --flat-soft:#E2DEFA; --flat-ink:#2C2270;
  --change:#B84A17; --change-soft:#FADCC8; --change-ink:#5E2309;
  --dom-soft:#D6E6F7; --dom-ink:#123B66;
  --k-ivory:#FBFAF6; --k-ebony:#1D1F1E; --k-edge:#9CA39E;
  --k-tonic:#1C6A50; --k-tonic-ink:#FFFFFF;
  --k-scale:#CFE9DD; --k-scale-ink:#0E3B2C; --k-scaleb:#2E7D61; --k-scaleb-ink:#FFFFFF;
  --k-acc:#DDD8FA; --k-acc-ink:#2C2270; --k-accb:#5B4BC4; --k-accb-ink:#FFFFFF;
  --k-chg:#F7CDB2; --k-chg-ink:#5E2309; --k-chgb:#E58A52; --k-chgb-ink:#2A0E02;
  --k-start:#DADFDB; --k-start-ink:#17201B; --k-startb:#59645D; --k-startb-ink:#FFFFFF;
  --k-path:#E3F1EA; --k-path-ink:#0E3B2C;
  --k-sub:#5B4BC4; --k-sub-ink:#FFFFFF; --k-sub-line:#7D6EE8;
  --k-lt:#E58A52; --k-lt-ink:#2A0E02; --k-lt-line:#E58A52;
  --k-dom:#2F6FB0; --k-dom-ink:#FFFFFF;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-music:"Noto Music", "Noto Sans Symbols 2", "Segoe UI Symbol", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A201C; --fg:#E5EAE6; --muted:#9AA59E; --line:#2E3832;
  --accent:#63C9A1; --accent-soft:#1D3A2F; --accent-ink:#CFF0E2; --on-accent:#08251A;
  --flat:#A99DF2; --flat-soft:#2A2550; --flat-ink:#E1DCFF;
  --change:#F08A50; --change-soft:#4A2614; --change-ink:#FFE1CF; --dom-soft:#1B2E45; --dom-ink:#CFE2FA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A201C; --fg:#E5EAE6; --muted:#9AA59E; --line:#2E3832;
  --accent:#63C9A1; --accent-soft:#1D3A2F; --accent-ink:#CFF0E2; --on-accent:#08251A;
  --flat:#A99DF2; --flat-soft:#2A2550; --flat-ink:#E1DCFF;
  --change:#F08A50; --change-soft:#4A2614; --change-ink:#FFE1CF; --dom-soft:#1B2E45; --dom-ink:#CFE2FA; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,2.9rem);line-height:1.05}
h2{font-size:1.55rem;line-height:1.2}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.lede{color:var(--muted);max-width:60ch;margin:10px 0 0}
p{margin:0}
.head{display:flex;flex-direction:column;gap:6px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.lang{display:flex;gap:6px}
.lang button{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;min-height:38px;border-radius:999px;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.flag{width:24px;height:17px;border-radius:3px;display:block;box-shadow:0 0 0 1px var(--line)}
.sec-head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sec-head .sub{font-family:var(--f-body);font-size:1rem;color:var(--muted);font-weight:400}
.desc{color:var(--muted);max-width:62ch}
.top{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:760px){.top{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.circle-wrap{display:flex;flex-direction:column;gap:14px;min-width:0}
#circle{width:100%;max-width:400px;margin:0 auto;display:block}
.controls{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:1 1 auto}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
button{font:500 .9rem/1.2 var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--muted)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.nav{display:flex;gap:8px}
.nav button{flex:1}
.play{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
#keyname{font-size:2.3rem;line-height:1.05}
#keyname small{font-family:var(--f-body);font-size:1rem;color:var(--muted);display:block;margin-top:4px}
#staff{width:100%;max-width:260px;height:auto;display:block}
.sig{font-family:var(--f-mono);font-size:.95rem}
.sig .new{color:var(--change);font-weight:500}
.change{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.change .move{font-family:var(--f-display);font-size:1.2rem}
.change .move .arrow{color:var(--muted);padding:0 6px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.pill.chg{background:var(--change-soft);color:var(--change-ink)}
.rule{font-size:.92rem;color:var(--muted)}
.check{font-family:var(--f-mono);font-size:.85rem;background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 12px}
.board{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px}
.board svg{display:block;width:100%;min-width:340px;height:auto}
.kname{font-family:var(--f-mono);font-size:12px;fill:var(--fg)}
.klab{font-family:var(--f-mono);font-size:12px;font-weight:500}
.kstep{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.kstep.h{fill:var(--change);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--k-edge);display:inline-block}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bar .now{font-family:var(--f-mono);font-size:.88rem;color:var(--muted);min-width:0}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle{stroke:var(--accent);stroke-width:3}
.gloss-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
#gq{font:400 1rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1 1 220px;min-width:0}
#gcount{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.gloss{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--line)}
@media (min-width:700px){.gloss{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}}
.gi{padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.gi dt{font-weight:600;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.gi dt .alt{font-weight:400;font-size:.88rem;color:var(--muted)}
.gi dd{margin:4px 0 0;font-size:.94rem;color:var(--fg)}
.empty{color:var(--muted);padding:14px 0}
.mus{font-family:var(--f-music)}
.ann{font-family:var(--f-mono);font-size:12px;fill:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chips .chip{min-height:44px;padding:5px 10px;border-radius:8px;font:500 .88rem/1.2 var(--f-mono);border:2px solid transparent;display:inline-flex;flex-direction:column;align-items:center;min-width:52px}
.chip small{font-size:.74rem;font-weight:400;font-family:var(--f-body)}
.chip.maj{background:var(--accent-soft);color:var(--accent-ink)}
.chip.min{background:var(--flat-soft);color:var(--flat-ink)}
.chip.dim{background:var(--change-soft);color:var(--change-ink)}
.chips .chip[aria-pressed="true"]{border-color:var(--fg)}
.rowlab{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tests{list-style:none;padding:0;margin:12px 0 16px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.tests li{display:flex;gap:10px;align-items:baseline;min-width:0}
.tests .ok{color:var(--accent);font-weight:600}
.tests .no{color:var(--change);font-weight:600}
.readout{font-family:var(--f-mono);font-size:.88rem;color:var(--fg);margin-top:10px}
.board svg.sq{max-width:440px;margin:0 auto}
.board svg.sm{max-width:380px;margin:0 auto}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.toc a{font-size:.84rem;color:var(--accent-ink);background:var(--accent-soft);padding:5px 11px;border-radius:999px;text-decoration:none}
.toc a:hover{text-decoration:underline}
.fT{background:var(--accent-soft);color:var(--accent-ink)}
.fSD{background:var(--flat-soft);color:var(--flat-ink)}
.fD{background:var(--dom-soft);color:var(--dom-ink)}
.chip.static{cursor:default}
.chips .chip.neutral{background:var(--surface);border:1px solid var(--line);color:var(--fg);cursor:pointer}
.chips .chip.neutral[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#pats .chip{flex-direction:row}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:10px}
@media (min-width:680px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fcard h3{font-size:1.05rem;display:flex;align-items:center;gap:8px}
.fcard .chips{margin:2px 0}
.fcard p{font-size:.9rem;color:var(--muted)}
.harm{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:4px}
@media (min-width:680px){.harm{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid transparent;border-radius:12px;padding:14px;font:400 .92rem/1.4 var(--f-body)}
.hcard .hrom{font:500 1.05rem var(--f-mono)}
.hcard .hfn,.hcard .hplay{font-size:.82rem;font-weight:500}
.recipe{margin:12px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.sub-h{margin-top:28px}
.census{display:flex;flex-direction:column;gap:6px;margin:6px 0 16px}
.crow{display:grid;grid-template-columns:minmax(78px,auto) minmax(0,1fr) auto;align-items:center;gap:10px;min-height:42px;padding:6px 10px;text-align:left;border-radius:8px;font:500 .88rem var(--f-mono);background:var(--surface);border:1px solid var(--line)}
.crow[aria-pressed="true"]{border-color:var(--fg);border-width:2px}
.cbar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;height:14px}
.cbar i{background:var(--line);border-radius:2px}
.cbar i.q-a{background:var(--accent)}.cbar i.q-b{background:var(--flat)}.cbar i.q-c{background:var(--change)}
.cq{font-size:.82rem;white-space:nowrap}
.q-at{color:var(--accent-ink)}.q-bt{color:var(--flat-ink)}.q-ct{color:var(--change-ink)}
.notes{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.notes li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;max-width:68ch;min-width:0}
.notes li b{font-weight:600}
.notes .sw{margin-top:5px;flex:none}
.sw.dash{background:transparent;border:2px dashed var(--k-lt-line)}
.sw.dash2{background:transparent;border:2px dashed var(--k-sub-line)}
footer{color:var(--muted);font-size:.88rem;border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:no-preference){.node circle,.kk{transition:fill .25s ease}}
</style>

<main class="wrap">
  <header class="head">
    <div class="topbar">
      <p class="eyebrow" data-i="eyebrow"></p>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button id="lang-pt" aria-pressed="true" lang="pt-BR">
          <svg class="flag" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#009C3B"/><path d="M10 1.5 18.4 7 10 12.5 1.6 7z" fill="#FFDF00"/><circle cx="10" cy="7" r="3.2" fill="#002776"/><path d="M6.9 6.4q3-1 6.2.8" stroke="#FFFFFF" stroke-width=".6" fill="none"/></svg>
          <span>PT</span>
        </button>
        <button id="lang-en" aria-pressed="false" lang="en">
          <svg class="flag" viewBox="0 0 20 14" aria-hidden="true"><rect width="20" height="14" fill="#FFFFFF"/><g fill="#B22234"><rect y="0" width="20" height="1.08"/><rect y="2.15" width="20" height="1.08"/><rect y="4.31" width="20" height="1.08"/><rect y="6.46" width="20" height="1.08"/><rect y="8.62" width="20" height="1.08"/><rect y="10.77" width="20" height="1.08"/><rect y="12.92" width="20" height="1.08"/></g><rect width="8.6" height="7.54" fill="#3C3B6E"/><g fill="#FFFFFF"><circle cx="1.6" cy="1.4" r=".45"/><circle cx="4.3" cy="1.4" r=".45"/><circle cx="7" cy="1.4" r=".45"/><circle cx="2.95" cy="3.1" r=".45"/><circle cx="5.65" cy="3.1" r=".45"/><circle cx="1.6" cy="4.8" r=".45"/><circle cx="4.3" cy="4.8" r=".45"/><circle cx="7" cy="4.8" r=".45"/><circle cx="2.95" cy="6.4" r=".45"/><circle cx="5.65" cy="6.4" r=".45"/></g></svg>
          <span>EN</span>
        </button>
      </div>
    </div>
    <h1 data-i="title">Circle of Fifths Lab</h1>
    <p class="lede" data-i="lede"></p>
    <nav class="toc" id="toc">
      <a href="#h-jump" data-i="navJump"></a>
      <a href="#h-scale" data-i="navScale"></a>
      <a href="#h-tetra" data-i="navTetra"></a>
      <a href="#h-func" data-i="navFunc"></a>
      <a href="#h-names" data-i="navNames"></a>
      <a href="#h-int" data-i="navInt"></a>
      <a href="#h-hinge" data-i="navHinge"></a>
      <a href="#h-tri" data-i="navTri"></a>
      <a href="#h-origin" data-i="navOrigin"></a>
      <a href="#h-win" data-i="navWin"></a>
      <a href="#h-field" data-i="navField"></a>
      <a href="#h-prog" data-i="navProg"></a>
      <a href="#h-comp" data-i="navComp"></a>
      <a href="#h-gloss" data-i="navGloss"></a>
    </nav>
  </header>

  <section class="top" aria-label="Circle of fifths">
    <div class="circle-wrap">
      <svg id="circle" viewBox="0 0 360 360" role="group"></svg>
      <div class="controls">
        <div class="seg" role="group">
          <button id="dir-cw" aria-pressed="true" data-i="cw"></button>
          <button id="dir-ccw" aria-pressed="false" data-i="ccw"></button>
        </div>
        <div class="row">
          <div class="nav" style="flex:1 1 200px">
            <button id="prev" data-i="prev"></button>
            <button id="next" data-i="next"></button>
          </div>
          <div class="seg" role="group" style="flex:1 1 160px">
            <button id="nt-en" aria-pressed="true">C D E</button>
            <button id="nt-pt" aria-pressed="false">Dó Ré Mi</button>
          </div>
        </div>
      </div>
    </div>

    <article class="card" aria-live="polite">
      <p class="eyebrow" data-i="current"></p>
      <h2 id="keyname"></h2>
      <svg id="staff" viewBox="0 0 240 92" role="img" aria-label="Key signature"></svg>
      <p class="sig" id="sigtext"></p>
      <div class="change" id="change"></div>
      <p class="check" id="check"></p>
    </article>
  </section>

  <section aria-labelledby="h-jump">
    <div class="sec-head">
      <h2 id="h-jump" data-i="jumpTitle"></h2>
      <p class="desc" data-i="jumpDesc"></p>
    </div>
    <div class="bar">
      <span class="now" id="jumpnow"></span>
      <button class="play" id="play-jump"><span aria-hidden="true">▶</span> <span data-i="playJump"></span></button>
    </div>
    <div class="board"><svg id="jump" role="img"></svg></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--k-start)"></i><span data-i="lgStart"></span></span>
      <span><i class="sw" style="background:var(--k-path)"></i><span data-i="lgPath"></span></span>
      <span><i class="sw" style="background:var(--k-tonic)"></i><span data-i="lgDest"></span></span>
      <span><i class="sw" style="background:var(--k-chg)"></i><span data-i="lgChg"></span></span>
    </div>
  </section>

  <section aria-labelledby="h-scale">
    <div class="sec-head">
      <h2 id="h-scale" data-i="scaleTitle"></h2>
      <p class="desc" data-i="scaleDesc"></p>
    </div>
    <div class="bar">
      <span class="now" id="scalenow"></span>
      <button class="play" id="play-scale"><span aria-hidden="true">▶</span> <span data-i="playScale"></span></button>
    </div>
    <div class="board"><svg id="scale" role="img"></svg></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--k-tonic)"></i><span data-i="lgTonic"></span></span>
      <span><i class="sw" style="background:var(--k-scale)"></i><span data-i="lgScale"></span></span>
      <span><i class="sw" style="background:var(--k-acc)"></i><span data-i="lgAcc"></span></span>
      <span><i class="sw" style="background:var(--k-chg)"></i><span data-i="lgNow"></span></span>
    </div>
  </section>

  <section aria-labelledby="h-tetra">
    <div class="sec-head">
      <h2 id="h-tetra" data-i="tetraTitle"></h2>
      <p class="desc" data-i="tetraDesc"></p>
    </div>
    <div class="bar">
      <span class="now" id="tetranow"></span>
      <button class="play" id="play-tetra"><span aria-hidden="true">▶</span> <span data-i="playTetra"></span></button>
    </div>
    <div class="board"><svg id="tetra" role="img"></svg></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--k-scale)"></i><span data-i="lgT1"></span></span>
      <span><i class="sw" style="background:var(--k-dom)"></i><span data-i="lgT2"></span></span>
      <span><i class="sw" style="background:var(--k-acc)"></i><span data-i="lgT3"></span></span>
      <span><i class="sw" style="background:var(--k-lt)"></i><span data-i="lgTch"></span></span>
    </div>
    <ul class="notes" id="tetranotes"></ul>
  </section>

  <section aria-labelledby="h-func">
    <div class="sec-head">
      <h2 id="h-func" data-i="funcTitle"></h2>
      <p class="desc" data-i="funcDesc"></p>
    </div>
    <div class="bar">
      <span class="now" id="funcnow"></span>
      <button class="play" id="play-func"><span aria-hidden="true">▶</span> <span data-i="playFunc"></span></button>
    </div>
    <div class="board"><svg id="func" role="img"></svg></div>
    <ul class="notes" id="funcnotes"></ul>
  </section>

  <section aria-labelledby="h-names">
    <div class="sec-head">
      <h2 id="h-names" data-i="namesTitle"></h2>
      <p class="desc" data-i="namesDesc"></p>
    </div>

  ivName:(g,q)=>g===1?'uníssono':`${g}ª ${q}`,
  intNow:(a,b,g,s,n)=>`${a}–${b} · ${g} nomes · ${s} semitons · ${n}`,

  intWhy:[
   '<b>Duas réguas</b>: todo intervalo tem duas medidas. O número (2ª, 3ª, 5ª…) conta nomes de nota, ou seja, posições na pauta, que só tem 7 letras. A qualidade (justa, maior, menor…) conta semitons no teclado, que tem 12 teclas. A pauta diz quantas letras; o teclado diz a distância exata.',
   '<b>Contagem inclusiva</b>: os latinos contavam incluindo o ponto de partida, e não começavam do zero (os algarismos romanos não têm zero). Por isso a mesma nota é o uníssono, a “1ª”, e não a “0ª”. O português guarda esse hábito: “daqui a oito dias” é uma semana, e “quinze dias” são duas semanas. A oitava é a mesma ideia: oito nomes, de Dó a Dó.',
   '<b>A aritmética</b>: se o número conta as duas pontas, então número = passos de letra + 1. Somar intervalos é somar passos: 4ª (3 passos) + 5ª (4 passos) = 7 passos = 8ª. Em fórmula, a + b − 1. Pelo mesmo motivo a 9ª é uma 2ª uma oitava acima (2 + 8 − 1), e os acordes com 9, 11 e 13 são a 2ª, a 4ª e a 6ª empilhadas acima da oitava.',
   '<b>A escala maior é a régua</b>: meça cada nota da escala maior a partir da tônica. Você obtém 2ª maior, 3ª maior, 4ª justa, 5ª justa, 6ª maior, 7ª maior e 8ª justa. Por definição, maior e justa são os tamanhos que a escala maior dá a partir da tônica. Um semitom a menos transforma maior em menor e justa em diminuta; um a mais faz aumentada.',
   '<b>Os dois trechos curtos</b>: entre duas teclas brancas vizinhas quase sempre há uma preta no meio, então a distância é um tom (2 semitons). Só em dois lugares não há preta: Mi–Fá e Si–Dó, a um semitom. O tamanho de qualquer intervalo da escala depende de quantos desses trechos curtos ele atravessa. No teclado acima, eles aparecem como S em laranja.',
   '<b>Terças: dois tamanhos comuns</b>: a terça anda 2 passos e atravessa 0 ou 1 trecho curto. Sem trecho curto, 2 + 2 = 4 semitons (Dó–Mi). Com um, 2 + 1 = 3 (Ré–Fá). Na escala, 3 terças têm 4 semitons e 4 têm 3. Como nenhum tamanho é “o normal”, os dois ganharam nome: maior e menor. O mesmo vale para 2ªs, 6ªs e 7ªs.',
   '<b>Quintas: um tamanho só, mais uma exceção</b>: a quinta anda 4 passos e quase sempre atravessa exatamente 1 trecho curto: 2 + 2 + 2 + 1 = 7 semitons. Só Si–Fá atravessa os dois e fica com 6. Com 6 de 7 iguais, existe “a” quinta, chamada justa, e a que foge ganha nome de exceção: diminuta. O mesmo vale para as 4ªs, onde a exceção é Fá–Si, a 4ª aumentada.',
   '<b>Por que nenhuma quinta escapa</b>: o maior trecho seguido sem semitom é Fá–Sol–Lá–Si, três tons, o trítono. A quinta precisa de quatro passos, então sempre esbarra em pelo menos um trecho curto. (Na teoria, o fato de cada número ter sempre dois tamanhos na escala tem nome: propriedade de Myhill.)',
   '<b>Consonâncias perfeitas e imperfeitas</b>: a teoria medieval chamava de perfeitas o uníssono, a 8ª, a 5ª e a 4ª, razões feitas só com 1, 2, 3 e 4 (1:1, 2:1, 3:2, 4:3), os números da tétrade pitagórica. Os primeiros cantos a várias vozes, o organum, por volta do século IX, andavam em 4ªs, 5ªs e 8ªs paralelas. As 3ªs e 6ªs eram consonâncias imperfeitas: na afinação pitagórica a 3ª maior fica 81:64, áspera. Elas só ganharam o centro da harmonia no fim da Idade Média e no Renascimento, com afinações que adoçavam as terças.',
   '<b>Inversão</b>: virar o intervalo troca o número por 9 − n e os semitons por 12 − s. Maior vira menor (3ª maior de 4 ↔ 6ª menor de 8), aumentada vira diminuta, e justa continua justa (5ª de 7 ↔ 4ª de 5). As justas são as únicas que mantêm a qualidade, mais um motivo para o nome.',
   '<b>Em outras línguas</b>: justa em português e espanhol, juste em francês, rein (“pura”) em alemão, perfect em inglês. Todas dizem a mesma coisa: exata, sem variação.'],
  navLabel:'Nesta página',navJump:'O salto',navScale:'A escala',navTetra:'Tetracordes',navFunc:'Funções',navNames:'Nomes',navHinge:'Dobradiças',navTri:'Trítono',navOrigin:'Origem',navWin:'Janela',navField:'Campo harmônico',navProg:'Progressões',navComp:'Compor',navGloss:'Glossário',

  namesTitle:'De onde vêm os nomes <span class="sub">· graus e intervalos</span>',
  namesDesc:'Os nomes dos graus medem a distância até a tônica e formam um espelho em volta dela: a dominante fica uma quinta acima e a subdominante uma quinta abaixo; a mediante uma terça acima e a submediante uma terça abaixo; a supertônica e a sensível são as vizinhas.',

  nI:[
   '<b>2ª, 3ª, 4ª, 5ª…</b>: os intervalos contam nomes de nota, incluindo as duas pontas, como as posições na pauta. Os nomes vêm dos ordinais latinos: secunda, tertia, quarta, quinta. Por isso uma 4ª mais uma 5ª dão uma 8ª, e não uma 9ª: a nota do meio é contada duas vezes.',
   '<b>Justa</b>: uníssono, 4ª, 5ª e 8ª eram as consonâncias perfeitas da teoria medieval, as razões mais simples entre cordas (1:1, 4:3, 3:2, 2:1). Na escala eles têm um só tamanho natural (a exceção é Fá–Si) e, invertidos, continuam justos. Os outros intervalos (2ª, 3ª, 6ª, 7ª) aparecem em dois tamanhos, e por isso são maiores ou menores. Justa quer dizer exata; em inglês, perfect.',
   '<b>Tônica</b>: do grego tónos, “tensão” ou “tom”. É a nota que dá o tom à música e onde a tensão se desfaz.',
   '<b>Dominante</b>: no canto gregoriano, a dominante era a nota de recitação, a mais repetida, muitas vezes uma quinta acima da nota final. Rameau, nos anos 1720, fixou o nome para o 5º grau: a nota que domina a tonalidade depois da tônica.',
   '<b>Subdominante</b>: termo de Rameau (sous-dominante), “a dominante de baixo”, uma quinta abaixo da tônica. Não quer dizer “logo abaixo da dominante”, embora na escala ela fique ali.',
   '<b>Mediante e submediante</b>: a mediante (3º grau) fica no meio do caminho entre a tônica e a dominante. A submediante (6º grau) fica no meio do caminho entre a tônica e a subdominante de baixo. Uma é o espelho da outra.',
   '<b>Supertônica</b>: o 2º grau, logo acima da tônica.',
   '<b>Sensível</b>: do francês note sensible, a nota sensível à atração da tônica. Em inglês, leading tone, a nota que conduz.'],
  triTitle:'O trítono <span class="sub">· três tons, meia oitava</span>',
  triDesc:'O trítono é a distância entre as duas dobradiças. Ele tem propriedades que nenhum outro intervalo tem, e cada uma explica um pedaço da harmonia.',
  playTri:'Ouvir trítono, depois quinta',triB1:'T+T+T = 6',triB2:'S+T+T+S = 6',
  trName:(a,b,c,d)=>`<b>O nome</b>: do latim tri + tonus, três tons inteiros: ${a}–${b}, ${b}–${c}, ${c}–${d}.`,
  trMirror:'<b>Espelho perfeito</b>: o trítono divide a oitava exatamente ao meio, 6 + 6. Invertido, continua trítono. É o único intervalo que é o seu próprio espelho, e por isso soa ambíguo: sozinho, não aponta para um lado.',
  trUnique:(a,b,k)=>`<b>Impressão digital</b>: a escala maior tem um único trítono, ${a}–${b}, e entre as tonalidades maiores só ${k} tem esse par. Ouvir ${a}–${b} é saber a tonalidade (ou a sua relativa menor).`,

  logicTitle:'A lógica por baixo',
  pLogic:[
   '<b>Quinta descendente é o movimento mais forte</b>: a fundamental cai uma quinta (V → I, ii → V). Só uma nota fica e as outras andam por tom ou semitom. No círculo, é andar no sentido anti-horário, em direção à tônica.',
   '<b>Terça é o movimento mais suave</b>: duas notas ficam e só uma anda. Por isso I → vi ou IV → ii soam como troca de cor, não de lugar.',
   '<b>Grau é o movimento de contraste</b>: nenhuma nota em comum (IV → V). O ouvido sente um empurrão.',
   '<b>Condução de vozes</b>: no teclado, cada acorde aparece na posição mais próxima do anterior. As notas em comum ficam paradas, e as tracejadas mostram de onde as outras vozes saíram. É assim que o pianista encadeia acordes sem saltar pelo teclado.'],

   'Ritmo harmônico: um acorde por compasso é o padrão. Trocar mais rápido perto da cadência cria impulso.',

  originDesc:'Pythagoras measured strings: half a string sounds an octave higher (2:1), two thirds sound a fifth higher (3:2). Each line in the drawing joins a note to the next fifth. In pure tuning, 12 fifths never land exactly back on C: the drawing becomes a spiral and the Pythagorean comma is left over. The piano uses equal temperament, shrinking every fifth slightly so the circle closes.',

  lgMaj:'major (4 + 3)',lgMin:'minor (3 + 4)',lgDim:'diminished (3 + 3)',window:'window',
  navInt:'Intervals',
  intTitle:'Intervals <span class="sub">· number and quality</span>',
  intDesc:'Pick a number. The list shows the 7 intervals of that number inside the current scale, one from each degree, with its size in half steps. Notice that every number comes in exactly two sizes (the octave is the exception, with one). Tap a row to see it on the keyboard: the numbers inside the keys count letter names, and the bracket counts half steps.',
  intPick:'Interval number',playInt:'Play the interval',intWhyTitle:'Why these names',
  ord:n=>['','1st','2nd','3rd','4th','5th','6th','7th','8ve'][n],q:{P:'perfect',M:'major',m:'minor',A:'augmented',d:'diminished'},
  ivName:(g,q)=>g===1?'perfect unison':`${q} ${['','unison','2nd','3rd','4th','5th','6th','7th','octave'][g]}`,
  intNow:(a,b,g,s,n)=>`${a}–${b} · ${g} letter names · ${s} half steps · ${n}`,
  intInv:(b,a,n,is,g,ig,s)=>`<b>Inverted</b>: ${b}–${a} = ${n} (${is} half steps). Numbers: ${g} + ${ig} = 9 · Half steps: ${s} + ${is} = 12.`,
  intWhy:[
   '<b>Two rulers</b>: every interval has two measurements. The number (2nd, 3rd, 5th…) counts letter names, that is, staff positions, and the staff has only 7 letters. The quality (perfect, major, minor…) counts half steps on the keyboard, which has 12 keys. The staff says how many letters; the keyboard says the exact distance.',
   '<b>Inclusive counting</b>: Latin speakers counted including the starting point, and never from zero (Roman numerals have no zero). That is why the same note is the unison, the “1st”, not the “0th”. Romance languages keep the habit: Portuguese “oito dias” (eight days) means a week and “quinze dias” (fifteen days) two weeks; French says “quinze jours”. The octave is the same idea: eight names, C to C.',
   '<b>The arithmetic</b>: if the number counts both ends, then number = letter steps + 1. Adding intervals means adding steps: a 4th (3 steps) + a 5th (4 steps) = 7 steps = an octave. As a formula, a + b − 1. For the same reason a 9th is a 2nd an octave up (2 + 8 − 1), and chords with 9, 11 and 13 are the 2nd, 4th and 6th stacked above the octave.',
   '<b>The major scale is the ruler</b>: measure each note of the major scale from the tonic. You get major 2nd, major 3rd, perfect 4th, perfect 5th, major 6th, major 7th and perfect octave. By definition, major and perfect are the sizes the major scale gives from the tonic. One half step less turns major into minor and perfect into diminished; one more makes it augmented.',
   '<b>The two short gaps</b>: between two neighboring white keys there is almost always a black key, so the distance is a whole step (2 half steps). Only in two places is there no black key: E–F and B–C, a half step apart. The size of any interval in the scale depends on how many of these short gaps it crosses. On the keyboard above they show up as an orange H.',
   '<b>Thirds: two common sizes</b>: a third moves 2 steps and crosses 0 or 1 short gap. With none, 2 + 2 = 4 half steps (C–E). With one, 2 + 1 = 3 (D–F). In the scale, 3 thirds have 4 half steps and 4 have 3. Since neither size is “the normal one”, both got names: major and minor. The same holds for 2nds, 6ths and 7ths.',
   '<b>Fifths: one size, plus one exception</b>: a fifth moves 4 steps and almost always crosses exactly 1 short gap: 2 + 2 + 2 + 1 = 7 half steps. Only B–F crosses both and gets 6. With 6 of 7 alike, there is “the” fifth, called perfect, and the odd one out gets an exception’s name: diminished. The same holds for 4ths, where the exception is F–B, the augmented 4th.',
   '<b>Why no fifth escapes</b>: the longest run without a half step is F–G–A–B, three whole steps, the tritone. A fifth needs four steps, so it always runs into at least one short gap. (In theory, the fact that every number always has two sizes in the scale has a name: Myhill’s property.)',
   '<b>Perfect and imperfect consonances</b>: medieval theory called unison, octave, 5th and 4th perfect, ratios built only from 1, 2, 3 and 4 (1:1, 2:1, 3:2, 4:3), the numbers of the Pythagorean tetractys. The first multi-voice chant, organum, around the 9th century, moved in parallel 4ths, 5ths and octaves. 3rds and 6ths were imperfect consonances: in Pythagorean tuning the major 3rd is 81:64, rough. They only took center stage in the late Middle Ages and Renaissance, with tunings that sweetened the thirds.',
   '<b>Inversion</b>: flipping an interval turns the number into 9 − n and the half steps into 12 − s. Major becomes minor (major 3rd of 4 ↔ minor 6th of 8), augmented becomes diminished, and perfect stays perfect (5th of 7 ↔ 4th of 5). Perfect intervals are the only ones that keep their quality, one more reason for the name.',
   '<b>In other languages</b>: justa in Portuguese and Spanish, juste in French, rein (“pure”) in German, perfect in English. They all say the same thing: exact, without variation.'],
  navLabel:'On this page',navJump:'The jump',navScale:'The scale',navTetra:'Tetrachords',navFunc:'Functions',navNames:'Names',navHinge:'Hinges',navTri:'Tritone',navOrigin:'Origin',navWin:'Window',navField:'Diatonic chords',navProg:'Progressions',navComp:'Composing',navGloss:'Glossary',
  tetraTitle:'Tetrachords <span class="sub">· the scale as two equal blocks</span>',
  tetraDesc:'Tetrachord comes from Greek: tetra (four) + chordé (string). The Greek lyre was tuned in blocks of four strings, with the two outer strings a perfect fourth apart. A major scale is two blocks with the same shape, W W H, joined by a whole step. The upper block of one key is the lower block of the next key on the circle.',
  playTetra:'Play the three blocks',lgT1:'lower tetrachord',lgT2:'upper tetrachord',lgT3:'next tetrachord',lgTch:'new accidental',
  tetN1:(k,lo,up)=>`<b>${k}</b> = ${lo} + whole step + ${up}. Both blocks have the same shape: W W H.`,
  tetN2:(up,k2,nw,ch)=>`<b>The chain</b>: the block ${up} becomes the lower block of ${k2}. The next block, ${nw}, only gets the W W H shape by using ${ch}. That is where the new accidental comes from.`,
  tetN3:'<b>Why a fourth</b>: W + W + H = 5 half steps, a perfect fourth. Two blocks (5 + 5) plus the connecting whole step (2) make 12, the whole octave.',
  tetN4:'<b>Where the fifth shows up</b>: each block starts 7 half steps above the previous one (5 for the block + 2 for the link). Walking the chain of tetrachords is walking the circle of fifths.',
  namesTitle:'Where the names come from <span class="sub">· degrees and intervals</span>',
  namesDesc:'Degree names measure the distance to the tonic and form a mirror around it: the dominant is a fifth above and the subdominant a fifth below; the mediant a third above and the submediant a third below; the supertonic and the leading tone are the neighbors.',
  mFifth:'5th ↔ 5th',mThird:'3rd ↔ 3rd',mStep:'neighbors',
  lgFifths:'dominant and subdominant (5th)',lgMed:'mediant and submediant (3rd)',lgNb:'leading tone and supertonic (neighbors)',
  staffCap:(a,b)=>`${a} → ${b}: five staff positions, counting both ends. That is why it is a fifth.`,
  nI:[
   '<b>2nd, 3rd, 4th, 5th…</b>: intervals count note names, including both ends, like positions on the staff. The names come from Latin ordinals: secunda, tertia, quarta, quinta. That is why a 4th plus a 5th makes an octave (8th), not a 9th: the middle note is counted twice.',
   '<b>Perfect</b>: unison, 4th, 5th and octave were the perfect consonances of medieval theory, the simplest string ratios (1:1, 4:3, 3:2, 2:1). In the scale they come in one natural size (the exception is F–B) and stay perfect when inverted. The other intervals (2nd, 3rd, 6th, 7th) come in two sizes, which is why they are major or minor. Portuguese calls it justa, meaning exact.',
   '<b>Tonic</b>: from Greek tónos, “tension” or “tone”. The note that sets the tone of the music and where tension dissolves.',
   '<b>Dominant</b>: in Gregorian chant, the dominant was the reciting tone, the most repeated note, often a fifth above the final. Rameau, in the 1720s, fixed the name to degree 5: the note that dominates the key after the tonic.',
   '<b>Subdominant</b>: Rameau’s term (sous-dominante), “the lower dominant”, a fifth below the tonic. It does not mean “just below the dominant”, even though that is where it sits in the scale.',
   '<b>Mediant and submediant</b>: the mediant (degree 3) is halfway between the tonic and the dominant. The submediant (degree 6) is halfway between the tonic and the lower dominant. Each is the other’s mirror.',
   '<b>Supertonic</b>: degree 2, just above the tonic.',
   '<b>Leading tone</b>: it leads to the tonic, a half step above. French calls it note sensible, the note sensitive to the tonic’s pull.'],
  triTitle:'The tritone <span class="sub">· three whole steps, half an octave</span>',
  triDesc:'The tritone is the distance between the two hinges. It has properties no other interval has, and each one explains a piece of harmony.',
  playTri:'Play tritone, then fifth',triB1:'W+W+W = 6',triB2:'H+W+W+H = 6',
  trName:(a,b,c,d)=>`<b>The name</b>: from Latin tri + tonus, three whole steps: ${a}–${b}, ${b}–${c}, ${c}–${d}.`,
  trMirror:'<b>A perfect mirror</b>: the tritone splits the octave exactly in half, 6 + 6. Inverted, it is still a tritone. It is the only interval that is its own mirror, which is why it sounds ambiguous: on its own it does not point either way.',
  trUnique:(a,b,k)=>`<b>A fingerprint</b>: the major scale has a single tritone, ${a}–${b}, and among major keys only ${k} has that pair. Hearing ${a}–${b} tells you the key (or its relative minor).`,
  trDevil:'<b>Diabolus in musica</b>: a traditional nickname linked to medieval theory, which avoided this interval. The phrase itself is documented later than the Middle Ages.',
  trRes:(a,b,c,d)=>`<b>Where it goes</b>: each note moves a half step, ${a} → ${c} and ${b} → ${d}. The dominant chord contains both notes, and that is where its pull comes from.`,
  progTitle:'Progressions <span class="sub">· functions, motion and voice leading</span>',
  progDesc:'A progression is a story of tension and rest. The 7 chords group into three functions by what they share: chords with two notes in common sound alike and can stand in for each other.',

/* ---------- music model ---------- */
const NAT=[0,2,4,5,7,9,11], OFF=[0,2,4,5,7,9,11];
const LET=['C','D','E','F','G','A','B'], SOL=['Dó','Ré','Mi','Fá','Sol','Lá','Si'];
const ACC={'-2':'𝄫','-1':'♭','0':'','1':'♯','2':'𝄪'};
const SLOTS=[[0,0],[4,0],[1,0],[5,0],[2,0],[6,0],null,[1,-1],[5,-1],[2,-1],[6,-1],[3,0]];
const FS=[3,1], GB=[4,-1];
const SHARP_ORDER=[3,0,4,1,5,2,6], FLAT_ORDER=[6,2,5,1,4,0,3];
const ST_SHARP={3:8,0:5,4:9,1:6,5:3,2:7,6:4}, ST_FLAT={6:4,2:7,5:3,1:6,4:2,0:5,3:1};
const st={k:1,dir:'cw',enh:'Fs',nt:'en',lang:'pt',tune:'pure',deg:0,ivl:5,ivr:0};
const $=id=>document.getElementById(id);
const L=()=>T[st.lang];

const pcOf=t=>(NAT[t[0]]+t[1]+12)%12;
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function scaleOf(t){const tp=pcOf(t);return OFF.map((o,i)=>{const l=(t[0]+i)%7;let a=(((tp+o)%12-NAT[l])%12+12)%12;if(a>6)a-=12;return[l,a]})}
function nm(n){return (st.nt==='pt'?SOL:LET)[n[0]]+ACC[n[1]]}
function keyName(t){return nm(t)+' '+L().major}
function sigOf(t){const acc=scaleOf(t).filter(n=>n[1]!==0);if(!acc.length)return{type:0,list:[]};
  const sharp=acc[0][1]>0,ord=sharp?SHARP_ORDER:FLAT_ORDER;
  return{type:sharp?1:-1,list:ord.map(l=>acc.find(n=>n[0]===l)).filter(Boolean)}}
function sigShort(t){const s=sigOf(t);return s.type===0?'0':s.list.length+(s.type>0?'♯':'♭')}
function displayed(k){return k===6?(st.enh==='Gb'?GB:FS):SLOTS[k]}
function logical(k){return k===6?(st.dir==='cw'?FS:GB):SLOTS[k]}
function predSlot(k){return st.dir==='cw'?(k+11)%12:(k+1)%12}
function predLogical(k){const p=predSlot(k);if(p===6)return st.dir==='cw'?GB:FS;return SLOTS[p]}
function diff(pred,cur){const pm={};scaleOf(pred).forEach(n=>pm[n[0]]=n[1]);
  const sc=scaleOf(cur);for(let i=0;i<7;i++){const n=sc[i];if(pm[n[0]]!==n[1])return{l:n[0],from:pm[n[0]],to:n[1],deg:i+1}}return null}

/* ---------- circle ---------- */
function drawCircle(){
  const cx=180,cy=180,R=124,RO=163,svg=$('circle');
  svg.setAttribute('aria-label',L().circleAria);
  const pos=(k,r)=>{const a=(-90+30*k)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const p=predSlot(st.k);
  const [px,py]=pos(p,R),[qx,qy]=pos(st.k,R);
  const a1=st.dir==='cw'?-122:-58,a2=st.dir==='cw'?-58:-122,rr=88;
  const ap=a=>[cx+rr*Math.cos(a*Math.PI/180),cy+rr*Math.sin(a*Math.PI/180)];
  const [sx,sy]=ap(a1),[ex,ey]=ap(a2);
  let h=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  h+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  h+=`<path d="M${sx.toFixed(1)} ${sy.toFixed(1)} A${rr} ${rr} 0 0 ${st.dir==='cw'?1:0} ${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ah)"/>`;
  h+=`<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${qx.toFixed(1)}" y2="${qy.toFixed(1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>`;
  for(let k=0;k<12;k++){
    const [x,y]=pos(k,R),[ox,oy]=pos(k,RO),t=displayed(k);
    const side=k===0||k===6?'n':(k<6?'s':'f');
    let fill='var(--surface)',stroke='var(--line)',ink='var(--fg)',dash='';
    if(side==='s'){fill='var(--accent-soft)';stroke='var(--accent-soft)';ink='var(--accent-ink)'}
    if(side==='f'){fill='var(--flat-soft)';stroke='var(--flat-soft)';ink='var(--flat-ink)'}
    if(k===p){stroke='var(--accent)';dash=' stroke-dasharray="3 3"'}
    if(k===st.k){fill='var(--accent)';stroke='var(--accent)';ink='var(--on-accent)';dash=''}
    const lab=k===6?'6♯ / 6♭':(k===0?'0':(k<6?k+'♯':(12-k)+'♭'));
    const label=nm(t);
    h+=`<g class="node" role="button" tabindex="0" data-k="${k}" aria-label="${keyName(t)}, ${lab}">`+
       `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="23" fill="${fill}" stroke="${stroke}" stroke-width="1.5"${dash}/>`+
       `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" style="font:500 ${label.length>3?12:15}px var(--f-body);fill:${ink}">${label}</text></g>`;
    h+=`<text x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--f-mono);fill:var(--muted)">${lab}</text>`;
  }
  const cur=displayed(st.k);
  h+=`<text x="${cx}" y="${cy+4}" text-anchor="middle" dominant-baseline="central" style="font:400 30px var(--f-display);fill:var(--fg)">${nm(cur)}</text>`;
  h+=`<text x="${cx}" y="${cy+34}" text-anchor="middle" style="font:400 12px var(--f-mono);fill:var(--muted)">${L().major} · ${sigShort(cur)}</text>`;
  if(st.k===6)h+=`<text x="${cx}" y="${cy+52}" text-anchor="middle" style="font:400 11px var(--f-body);fill:var(--muted)">${L().tapAgain}: ${nm(FS)} ↔ ${nm(GB)}</text>`;
  svg.innerHTML=h;
}

/* ---------- keyboard ---------- */
const KW=28,WHH=118,BH=72;
const isBlack=s=>[1,3,6,8,10].includes(((s%12)+12)%12);
function layout(from,to){const wx={},whites=[],blacks=[];
  for(let s=from;s<=to;s++)if(!isBlack(s)){wx[s]=1+whites.length*KW;whites.push(s)}
  for(let s=from;s<=to;s++)if(isBlack(s)&&wx[s-1]!=null&&wx[s+1]!=null)blacks.push(s);
  const x=s=>isBlack(s)?wx[s-1]+KW-8.5:wx[s],c=s=>isBlack(s)?x(s)+8.5:x(s)+KW/2;
  return{whites,blacks,x,c,width:whites.length*KW+2}}
function drawKeys(svg,marks,steps,o={}){
  const lay=o.lay||layout(0,23),TOP=o.top||24,H=TOP+WHH+(steps?54:32);
  svg.setAttribute('viewBox',`0 0 ${lay.width} ${H}`);
  let h='',ghosts='';
  lay.whites.forEach(s=>{const m=marks[s],x=lay.x(s);
    h+=`<rect class="kk" x="${x}" y="${TOP}" width="${KW}" height="${WHH}" rx="3" style="fill:${m&&m.fill?m.fill:'var(--k-ivory)'};stroke:var(--k-edge);stroke-width:1"/>`;
    if(m&&m.ghost)ghosts+=`<rect x="${x+2}" y="${TOP+2}" width="${KW-4}" height="${WHH-4}" rx="3" fill="none" style="stroke:${m.ghost};stroke-width:2.2;stroke-dasharray:5 3"/>`;
    if(m&&m.label!=null)h+=`<text class="klab" x="${x+KW/2}" y="${TOP+WHH-14}" text-anchor="middle" style="fill:${m.ink}">${m.label}</text>`;
    if(m&&m.name)h+=`<text class="kname" x="${x+KW/2}" y="${TOP+WHH+18}" text-anchor="middle">${m.name}</text>`;});
  lay.blacks.forEach(s=>{const m=marks[s],x=lay.x(s);
    h+=`<rect class="kk" x="${x}" y="${TOP}" width="17" height="${BH}" rx="2" style="fill:${m&&m.fill?m.fill:'var(--k-ebony)'};stroke:var(--k-ebony);stroke-width:1"/>`;
    if(m&&m.ghost)ghosts+=`<rect x="${x+1.5}" y="${TOP+1.5}" width="14" height="${BH-3}" rx="2" fill="none" style="stroke:${m.ghost};stroke-width:2.2;stroke-dasharray:5 3"/>`;
    if(m&&m.label!=null)h+=`<text class="klab" x="${x+8.5}" y="${TOP+BH-11}" text-anchor="middle" style="fill:${m.ink}">${m.label}</text>`;
    if(m&&m.name)h+=`<text class="kname" x="${x+8.5}" y="${TOP-9}" text-anchor="middle">${m.name}</text>`;});
  h+=ghosts;
  if(steps)steps.forEach(s2=>{h+=`<text class="kstep${s2.h?' h':''}" x="${s2.x}" y="${TOP+WHH+42}" text-anchor="middle">${s2.t}</text>`});
  if(o.ann)h+=o.ann;
  svg.innerHTML=h;
}
function bracket(lay,a,b,y,label){const x1=lay.c(a).toFixed(1),x2=lay.c(b).toFixed(1),mx=((lay.c(a)+lay.c(b))/2).toFixed(1);
  return `<path d="M${x1} ${y+10} V${y} H${x2} V${y+10}" fill="none" stroke="var(--muted)" stroke-width="1.2"/><text class="ann" x="${mx}" y="${y-7}" text-anchor="middle">${label}</text>`}

/* ---------- functions piano ---------- */
function renderFunc(cur){
  const tr=L(),sc=scaleOf(cur),c=pcOf(cur)+12,sub=c-7,lt=c-1,dom=c+7;
  const lay=layout(isBlack(sub)?sub-1:sub,isBlack(dom)?dom+1:dom),marks={};
  marks[sub]={fill:'var(--k-sub)',ink:'var(--k-sub-ink)',label:4,name:nm(sc[3])};
  marks[lt]={fill:'var(--k-lt)',ink:'var(--k-lt-ink)',label:7,name:nm(sc[6])};
  marks[c]={fill:'var(--k-tonic)',ink:'var(--k-tonic-ink)',label:1,name:nm(sc[0])};
  marks[dom]={fill:'var(--k-dom)',ink:'var(--k-dom-ink)',label:5,name:nm(sc[4])};
  const x1=lay.c(lt),x2=lay.c(c);
  let ann=`<defs><marker id="fa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="var(--change)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;
  ann+=bracket(lay,sub,c,26,tr.fifthBelow)+bracket(lay,c,dom,26,tr.fifthAbove);
  ann+=`<path d="M${(x1-2).toFixed(1)} 52 Q${((x1+x2)/2).toFixed(1)} 40 ${(x2-2).toFixed(1)} 51" fill="none" stroke="var(--change)" stroke-width="1.8" marker-end="url(#fa)"/>`;
  drawKeys($('func'),marks,null,{lay,top:72,ann});
  $('func').setAttribute('aria-label',`${nm(sc[3])} 4, ${nm(sc[6])} 7, ${nm(sc[0])} 1, ${nm(sc[4])} 5`);
  $('funcnow').textContent=keyName(cur);
  $('funcnotes').innerHTML=
    `<li><i class="sw" style="background:var(--k-tonic)"></i><span>${tr.fTonic(nm(sc[0]))}</span></li>`+
    `<li><i class="sw" style="background:var(--k-sub)"></i><span>${tr.fSub(nm(sc[3]),keyName(sc[3]))}</span></li>`+
    `<li><i class="sw" style="background:var(--k-dom)"></i><span>${tr.fDom(nm(sc[4]),keyName(sc[4]))}</span></li>`+
    `<li><i class="sw" style="background:var(--k-lt)"></i><span>${tr.fLt(nm(sc[6]),nm(sc[0]))}</span></li>`;
  window._func={lt,c};
}

/* ---------- line of fifths helpers ---------- */
const LIDX=[1,3,5,0,2,4,6], ORD=[3,0,4,1,5,2,6], SLOTD=[1,3,5,0,2,4,6], ROM=['I','II','III','IV','V','VI','VII'];
const fIdx=n=>LIDX[n[0]]+7*n[1];
const fromF=f=>[ORD[((f%7)+7)%7],Math.floor(f/7)];

/* ---------- origin: stacked fifths ---------- */
function renderOrigin(){
  const tr=L(),svg=$('origin'),cx=180,cy=180,pure=st.tune!=='eq',pts=[];
  for(let k=0;k<=12;k++){const cents=pure?(k*701.955)%1200:(k*700)%1200,a=cents/1200*2*Math.PI-Math.PI/2,r=pure?64+k*8:128;
    pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a),r,a])}
  let h=`<line x1="${cx}" y1="62" x2="${cx}" y2="6" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 4"/>`;
  if(!pure)h+=`<circle cx="${cx}" cy="${cy}" r="128" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  h+=`<polyline points="${pts.slice(0,pure?13:13).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round" opacity=".8"/>`;
  pts.forEach((p,k)=>{const last=k===12;if(!pure&&last)return;
    const col=k===0?'var(--k-tonic)':(last?'var(--change)':'var(--accent)');
    h+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${k===0||last?5:3.5}" fill="${col}"/>`;
    const lr=p[2]+16,lx=cx+lr*Math.cos(p[3]),ly=cy+lr*Math.sin(p[3]);
    const name=k===0&&!pure?`${nm(fromF(1))} = ${nm(fromF(13))}`:nm(fromF(1+k));
    h+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" style="font:500 12px var(--f-mono);fill:${last?'var(--change)':'var(--fg)'}">${name}</text>`});
  if(pure)h+=`<text x="${cx+26}" y="36" dominant-baseline="central" style="font:500 12px var(--f-mono);fill:var(--change)">${tr.comma}</text>`;
  svg.innerHTML=h;
  svg.setAttribute('aria-label',pure?tr.readPure:tr.readEq);
  $('originread').textContent=pure?tr.readPure:tr.readEq;
  $('tune-pure').setAttribute('aria-pressed',pure);$('tune-eq').setAttribute('aria-pressed',!pure);
}

/* ---------- window on the line of fifths ---------- */
function slotBox(x,y,w,h,fill,stroke,dash){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" style="fill:${fill};stroke:${stroke};stroke-width:1.2${dash?';stroke-dasharray:4 3':''}"/>`}
function renderWindow(cur){
  const tr=L(),sc=scaleOf(cur),f0=fIdx(sc[3]),svg=$('win'),W=34,G=4,from=-2,to=8;
  const X=j=>2+(j-from)*(W+G),DEG=[4,1,5,2,6,3,7];
  const ROLE={0:['var(--k-sub)','var(--k-sub-ink)'],1:['var(--k-tonic)','var(--k-tonic-ink)'],2:['var(--k-dom)','var(--k-dom-ink)'],6:['var(--k-lt)','var(--k-lt-ink)']};
  let h=`<path d="M${X(0)} 30 V22 H${X(6)+W} V30" fill="none" stroke="var(--muted)" stroke-width="1.2"/><text class="ann" x="${(X(0)+X(6)+W)/2}" y="12" text-anchor="middle">${keyName(cur)}</text>`;
  for(let j=from;j<=to;j++){const n=fromF(f0+j),x=X(j),inW=j>=0&&j<=6,y=36,hh=54;
    if(inW){const r=ROLE[j]||['var(--accent-soft)','var(--accent-ink)'];
      h+=slotBox(x,y,W,hh,r[0],r[0],false);
      h+=`<text x="${x+W/2}" y="${y+20}" text-anchor="middle" dominant-baseline="central" style="font:500 13px var(--f-mono);fill:${r[1]}">${nm(n)}</text>`;
      h+=`<text x="${x+W/2}" y="${y+40}" text-anchor="middle" dominant-baseline="central" style="font:400 11px var(--f-mono);fill:${r[1]}">${DEG[j]}</text>`}
    else{const near=j===-1||j===7;
      h+=slotBox(x,y,W,hh,'transparent',near?'var(--change)':'var(--line)',true);
      h+=`<text x="${x+W/2}" y="${y+20}" text-anchor="middle" dominant-baseline="central" style="font:500 13px var(--f-mono);fill:${near?'var(--fg)':'var(--muted)'}">${nm(n)}</text>`;
      if(near)h+=`<text x="${x+W/2}" y="${y+40}" text-anchor="middle" dominant-baseline="central" style="font:500 13px var(--f-mono);fill:var(--change)">${j<0?'←':'→'}</text>`}}
  svg.setAttribute('viewBox',`0 0 ${X(to)+W+2} 100`);svg.innerHTML=h;
  const win=[0,1,2,3,4,5,6].map(j=>nm(fromF(f0+j))).join(' ');
  svg.setAttribute('aria-label',`${keyName(cur)}: ${win}`);
  $('winnow').textContent=win;
  $('winnotes').innerHTML=
    `<li><i class="sw" style="background:var(--accent-soft)"></i><span>${tr.winRead(keyName(cur),win)}</span></li>`+
    `<li><i class="sw dash"></i><span>${tr.winR(nm(fromF(f0)),nm(fromF(f0+7)),keyName(fromF(f0+2)))}</span></li>`+
    `<li><i class="sw dash"></i><span>${tr.winL(nm(fromF(f0+6)),nm(fromF(f0-1)),keyName(fromF(f0)))}</span></li>`;
}

/* ---------- harmonic field ---------- */
function chordInfo(sc,d){const i=SLOTD[d],q=i<=2?'maj':(i<=5?'min':'dim');
  const lab=nm(sc[d])+(q==='min'?'m':(q==='dim'?'°':''));
  const rom=q==='maj'?ROM[d]:ROM[d].toLowerCase()+(q==='dim'?'°':'');
  return{i,q,lab,rom}}
function renderField(cur){
  const tr=L(),sc=scaleOf(cur),f0=fIdx(sc[3]),d=st.deg||0,ci=chordInfo(sc,d),i=ci.i;

  $('chips-win').innerHTML=[3,0,4,1,5,2,6].map(chip).join('');

  const QC={maj:['var(--k-tonic)','var(--k-tonic-ink)'],min:['var(--k-sub)','var(--k-sub-ink)'],dim:['var(--k-lt)','var(--k-lt-ink)']}[ci.q];

  for(let j=from;j<=to;j++){const n=fromF(f0+j),x=X(j),inW=j>=0&&j<=6,y=36,hh=54,r=role[j];
    if(inW&&r){h+=slotBox(x,y,W,hh,QC[0],QC[0],false);

    else if(inW){h+=slotBox(x,y,W,hh,'var(--surface)','var(--accent)',false);

    else{const g=ghosts[j];h+=slotBox(x,y,W,hh,'transparent',g?'var(--change)':'var(--line)',true);
      h+=`<text x="${x+W/2}" y="${y+20}" text-anchor="middle" dominant-baseline="central" style="font:400 13px var(--f-mono);fill:var(--muted)">${nm(n)}</text>`;
      if(g)h+=`<text x="${x+W/2}" y="${y+40}" text-anchor="middle" dominant-baseline="central" style="font:500 13px var(--f-mono);fill:var(--change)">✗</text>`}}

/* ---------- tetrachords ---------- */

  for(let i=0;i<all.length-1;i++){const d=all[i+1]-all[i];steps.push({x:((lay.c(all[i])+lay.c(all[i+1]))/2).toFixed(1),t:d===2?tr.W:tr.H,h:d===1})}

    `<li><i class="sw" style="background:var(--k-dom)"></i><span>${tr.tetN3}</span></li>`+
    `<li><i class="sw" style="background:var(--k-acc)"></i><span>${tr.tetN4}</span></li>`;

}

/* ---------- intervals ---------- */

/* ---------- tritone ---------- */
function renderTri(cur){
  const tr=L(),sc=scaleOf(cur),s=pcOf(sc[3]),R=[0,2,4,6,7,9,11,12],D=[3,4,5,6,0,1,2,3];
  const lay=layout(isBlack(s)?s-1:s,isBlack(s+12)?s+13:s+12),marks={};
  R.forEach((o,i)=>{const p=s+o,d=D[i];let f,ink;
    if(d===3){f='var(--k-sub)';ink='var(--k-sub-ink)'}
    else if(d===6){f='var(--k-lt)';ink='var(--k-lt-ink)'}
    else if(d===0){f='var(--k-tonic)';ink='var(--k-tonic-ink)'}
    else if(i<3){f=fillFor(p,'var(--k-path)','var(--k-scaleb)');ink=fillFor(p,'var(--k-path-ink)','var(--k-scaleb-ink)')}
    else{f=fillFor(p,'var(--k-scale)','var(--k-scaleb)');ink=fillFor(p,'var(--k-scale-ink)','var(--k-scaleb-ink)')}
    marks[p]={fill:f,ink,label:d+1,name:nm(sc[d])}});
  const steps=[];for(let i=0;i<7;i++){const a=s+R[i],z=s+R[i+1],w=z-a===2;steps.push({x:((lay.c(a)+lay.c(z))/2).toFixed(1),t:w?tr.W:tr.H,h:!w})}
  drawKeys($('tri'),marks,steps,{lay,top:74,ann:bracket(lay,s,s+6,22,tr.triB1)+bracket(lay,s+6,s+12,48,tr.triB2)});
  $('tri').setAttribute('aria-label',`${nm(sc[3])}–${nm(sc[6])}`);
  $('trinow').textContent=`${nm(sc[3])}–${nm(sc[6])} · 6 ${tr.steps}`;
  $('trinotes').innerHTML=
    `<li><i class="sw" style="background:var(--k-path)"></i><span>${tr.trName(nm(sc[3]),nm(sc[4]),nm(sc[5]),nm(sc[6]))}</span></li>`+
    `<li><i class="sw" style="background:var(--k-scale)"></i><span>${tr.trMirror}</span></li>`+
    `<li><i class="sw" style="background:var(--k-sub)"></i><span>${tr.trUnique(nm(sc[3]),nm(sc[6]),keyName(cur))}</span></li>`+
    `<li><i class="sw" style="background:var(--k-lt)"></i><span>${tr.trRes(nm(sc[3]),nm(sc[6]),nm(sc[2]),nm(sc[0]))}</span></li>`+
    `<li><i class="sw" style="background:var(--line)"></i><span>${tr.trDevil}</span></li>`;
  window._tri=s;
}

/* ---------- progressions ---------- */
const FN=['T','SD','T','SD','D','T','D'];
const FC={T:['var(--k-tonic)','var(--k-tonic-ink)'],SD:['var(--k-sub)','var(--k-sub-ink)'],D:['var(--k-dom)','var(--k-dom-ink)']};
const triad=(sc,d)=>[sc[d],sc[(d+2)%7],sc[(d+4)%7]];
function common(sc,a,b){const A=triad(sc,a).map(pcOf);return triad(sc,b).filter(n=>A.includes(pcOf(n)))}
function voice(pcs,prev){
  if(!prev){const v=[pcs[0]];let x=pcs[1];while(x<=v[0])x+=12;v.push(x);x=pcs[2];while(x<=v[1])x+=12;v.push(x);return v}
  let best=null,bc=1e9;
  for(const a of [pcs[0],pcs[0]+12])for(const b of [pcs[1],pcs[1]+12])for(const c of [pcs[2],pcs[2]+12]){
    const v=[a,b,c].sort((x,y)=>x-y);if(v[2]-v[0]>12||v[2]>22)continue;
    const cost=v.reduce((s,x,i)=>s+Math.abs(x-prev[i]),0);if(cost<bc){bc=cost;best=v}}
  return best||voice(pcs,null)}
const PATS=[
 {deg:[0,3,4,0],pt:'A história completa: casa, afastamento, tensão, volta. É a base de hinos, folk, rock e blues.',en:'The complete story: home, departure, tension, return. The backbone of hymns, folk, rock and blues.'},
 {deg:[0,4,5,3],pt:'A progressão mais usada no pop das últimas décadas (“Let It Be”, “Don’t Stop Believin’”). Chega à tensão no V e, em vez de voltar ao I, cai no vi, primo menor da tônica, e respira no IV.',en:'The most used progression in pop of recent decades (“Let It Be”, “Don’t Stop Believin’”). It reaches tension on V and, instead of going home to I, lands on vi, the tonic’s minor cousin, then breathes on IV.'},
 {deg:[5,3,0,4],pt:'Os mesmos quatro acordes, começando no vi. Como o primeiro acorde é menor, o ouvido ouve a música como mais melancólica.',en:'The same four chords, starting on vi. Because the first chord is minor, the ear hears the song as more melancholic.'},
 {deg:[0,5,3,4],pt:'A progressão dos anos 50 (“Stand by Me”). T → T → SD → D: o vi prolonga a casa antes de sair.',en:'The 1950s progression (“Stand by Me”). T → T → SD → D: vi prolongs home before leaving.'},
 {deg:[1,4,0],pt:'O motor do jazz e da bossa nova. SD → D → T, com as fundamentais caindo de quinta em quinta.',en:'The engine of jazz and bossa nova. SD → D → T, with roots falling fifth by fifth.'},
 {deg:[5,1,4,0],pt:'O ciclo de quintas: cada fundamental desce uma quinta. São quatro passos anti-horários no círculo até chegar em casa.',en:'The cycle of fifths: each root falls a fifth. Four counter-clockwise steps on the circle until you reach home.'},
 {deg:[0,3,0],pt:'Cadência plagal, o “Amém” dos hinos: SD → T, sem a sensível. Soa como um repouso tranquilo, não como tensão que se resolve.',en:'Plagal cadence, the “Amen” of hymns: SD → T, with no leading tone. It sounds like quiet rest rather than tension resolving.'},
 {deg:[0,3,4,5],pt:'Cadência de engano: depois do V o ouvido espera o I e recebe o vi, que tem duas notas em comum com ele. A frase continua em vez de terminar.',en:'Deceptive cadence: after V the ear expects I and gets vi, which shares two notes with it. The phrase keeps going instead of ending.'},
 {deg:[0,4,5,2,3,0,3,4],npt:'Cânon de Pachelbel',nen:'Pachelbel’s Canon',pt:'As fundamentais descem uma quarta e sobem um grau, em degraus (I–V, vi–iii, IV–I). O padrão virou base de centenas de canções.',en:'The roots fall a fourth and rise a step, like stairs (I–V, vi–iii, IV–I). The pattern became the basis of hundreds of songs.'},
 {deg:[0,5,3,4,0,5,1,4,0],npt:'Frase de 8 compassos',nen:'8-bar phrase',pt:'Pergunta e resposta: os 4 primeiros compassos terminam no V (cadência suspensiva, como uma vírgula). Os seguintes trocam o IV pelo ii, da mesma função, e terminam em V → I (cadência perfeita, o ponto final).',en:'Question and answer: the first 4 bars end on V (half cadence, like a comma). The next ones swap IV for ii, same function, and end V → I (authentic cadence, the period).'}];
function patName(p,sc){return (st.lang==='pt'?p.npt:p.nen)||p.deg.map(d=>chordInfo(sc,d).rom).join('–')}
function renderProg(cur){
  const tr=L(),sc=scaleOf(cur),pi=Math.min(st.pat||0,PATS.length-1),P=PATS[pi],degs=P.deg;
  if(!(st.pi>=0&&st.pi<degs.length))st.pi=0;
  const ci=d=>chordInfo(sc,d),cn=(a,b)=>common(sc,a,b).map(nm).join(tr.and);
  const chipS=d=>`<span class="chip static f${FN[d]}">${ci(d).rom}<small>${ci(d).lab}</small></span>`;
  const fcard=(f,title,ds,text)=>`<div class="fcard"><h3><i class="sw" style="background:${FC[f][0]}"></i>${f} · ${title}</h3><div class="chips">${ds.map(chipS).join('')}</div><p>${text}</p></div>`;
  $('fmap').innerHTML=fcard('T',tr.fT,[0,5,2],tr.fTd(ci(5).lab,ci(2).lab,ci(0).lab,cn(0,5),cn(0,2)))+
    fcard('SD',tr.fSD,[3,1],tr.fSDd(ci(1).lab,ci(3).lab,cn(3,1)))+
    fcard('D',tr.fD,[4,6],tr.fDd(ci(6).lab,ci(4).lab,cn(4,6),nm(sc[6])));
  $('pats').innerHTML=PATS.map((p,i)=>`<button class="chip neutral" data-p="${i}" aria-pressed="${i===pi}">${patName(p,sc)}</button>`).join('');
  $('patdesc').innerHTML=P[st.lang];
  $('progchips').innerHTML=degs.map((d,i)=>`<button class="chip f${FN[d]}" data-c="${i}" aria-pressed="${i===st.pi}">${ci(d).rom}<small>${ci(d).lab} · ${FN[d]}</small></button>`).join('');
  const vs=[];let prev=null;degs.forEach(d=>{const v=voice(triad(sc,d).map(pcOf),prev);vs.push(v);prev=v});
  const v=vs[st.pi],d=degs[st.pi],fc=FC[FN[d]],tri=triad(sc,d),marks={};
  if(st.pi>0)vs[st.pi-1].forEach(p=>{if(!v.includes(p))marks[p]={ghost:'var(--muted)'}});
  v.forEach(p=>{const k=tri.findIndex(n=>pcOf(n)===((p%12)+12)%12);marks[p]={fill:fc[0],ink:fc[1],label:['1','3','5'][k],name:nm(tri[k])}});
  drawKeys($('progkeys'),marks,null,{lay:layout(0,23)});
  const c=ci(d);let read;
  if(st.pi===0)read=tr.progStart(`${c.rom} (${c.lab})`,FN[d]);
  else{const d0=degs[st.pi-1],c0=ci(d0),diff=(d-d0+7)%7,cm=common(sc,d0,d);
    read=tr.progMove(`${c0.rom} (${c0.lab})`,`${c.rom} (${c.lab})`,tr.mv[diff],cm.length,cm.map(nm).join(tr.and),tr.feel[diff])}
  $('progread').textContent=read;$('progkeys').setAttribute('aria-label',read);
  $('prognow').textContent=`${keyName(cur)} · ${st.pi+1}/${degs.length}`;
  $('proglogic').innerHTML=tr.pLogic.map(s=>`<li><span>${s}</span></li>`).join('');
  window._prog={vs,roots:degs.map(d=>pcOf(sc[d]))};
}

/* ---------- composing ---------- */
function renderCompose(cur){
  const tr=L(),sc=scaleOf(cur),m=st.mel||0;
  $('melchips').innerHTML=sc.map((n,i)=>`<button class="chip neutral" data-m="${i}" aria-pressed="${i===m}">${nm(n)}<small>${i+1}</small></button>`).join('');

    return `<button class="hcard f${FN[d]}" data-h="${d}"><span class="hrom">${c.rom} · ${c.lab}</span><span>${tr.harmRole(nm(sc[m]),tr[r])}</span><span class="hfn">${FN[d]} · ${tr.fnName[FN[d]]}</span><span class="hplay">▶ ${tr.playHarm}</span></button>`}).join('');
  $('recipe').innerHTML=tr.recipe.map(s=>`<li>${s}</li>`).join('');
}

/* ---------- hinges piano ---------- */
function renderHinge(cur){
  const tr=L(),sc=scaleOf(cur),b=pcOf(cur),notes=OFF.map(o=>b+o).concat(b+12);
  const lay=layout(isBlack(b)?b-1:b,isBlack(b+12)?b+13:b+12),marks={};
  notes.forEach((s,i)=>{const n=sc[i%7],deg=i%7+1;let f,ink;
    if(deg===1){f='var(--k-tonic)';ink='var(--k-tonic-ink)'}
    else if(deg===4){f='var(--k-sub)';ink='var(--k-sub-ink)'}
    else if(deg===7){f='var(--k-lt)';ink='var(--k-lt-ink)'}
    else{f=fillFor(s,'var(--k-scale)','var(--k-scaleb)');ink=fillFor(s,'var(--k-scale-ink)','var(--k-scaleb-ink)')}
    marks[s]={fill:f,ink,label:deg,name:nm(n)}});
  const up=notes[3]+1,down=notes[6]-1,upN=[sc[3][0],sc[3][1]+1],dnN=[sc[6][0],sc[6][1]-1];
  marks[up]={ghost:'var(--k-lt-line)',ink:fillFor(up,'var(--k-start-ink)','var(--k-tonic-ink)'),label:'↑',name:nm(upN)};
  marks[down]={ghost:'var(--k-sub-line)',ink:fillFor(down,'var(--k-start-ink)','var(--k-tonic-ink)'),label:'↓',name:nm(dnN)};
  const steps=[];for(let i=0;i<7;i++){const a=notes[i],z=notes[i+1],w=z-a===2;steps.push({x:((lay.c(a)+lay.c(z))/2).toFixed(1),t:w?tr.W:tr.H,h:!w})}
  drawKeys($('hinge'),marks,steps,{lay,top:72,ann:bracket(lay,notes[3],notes[6],26,tr.tritone)});
  $('hinge').setAttribute('aria-label',`${nm(sc[3])}–${nm(sc[6])}`);
  $('hingenow').textContent=`${keyName(cur)} · ${nm(sc[3])}–${nm(sc[6])}`;
  $('hingenotes').innerHTML=
    `<li><i class="sw dash"></i><span>${tr.hUp(nm(sc[3]),nm(upN),keyName(sc[4]))}</span></li>`+
    `<li><i class="sw dash2"></i><span>${tr.hDown(nm(sc[6]),nm(dnN),keyName(sc[3]))}</span></li>`+
    `<li><i class="sw" style="background:var(--k-scale)"></i><span>${tr.hRes(nm(sc[3]),nm(sc[6]),nm(sc[2]),nm(sc[0]))}</span></li>`;
  window._hinge={n4:notes[3],n7:notes[6]};
}
const fillFor=(s,w,b)=>isBlack(s)?b:w;

/* ---------- staff ---------- */
function drawStaff(t,newLetter){
  const s=sigOf(t),svg=$('staff');let h='';
  const yb=62,gap=9;
  for(let i=0;i<5;i++)h+=`<line x1="4" x2="236" y1="${yb-i*gap}" y2="${yb-i*gap}" stroke="var(--fg)" stroke-width="1" opacity=".75"/>`;
  h+=`<text x="8" y="${yb-gap}" class="mus" style="font-size:44px;fill:var(--fg)">𝄞</text>`;
  s.list.forEach((n,i)=>{const idx=(s.type>0?ST_SHARP:ST_FLAT)[n[0]],y=yb-idx*gap/2,x=58+i*15;
    const col=n[0]===newLetter?'var(--change)':'var(--fg)';
    h+=`<text x="${x}" y="${(s.type>0?y:y-3).toFixed(1)}" text-anchor="middle" dominant-baseline="central" class="mus" style="font-size:22px;fill:${col}">${s.type>0?'♯':'♭'}</text>`});
  if(!s.list.length)h+=`<text x="70" y="${yb-2*gap}" dominant-baseline="central" style="font:400 12px var(--f-mono);fill:var(--muted)">${L().staffNone}</text>`;
  svg.innerHTML=h;
}

/* ---------- render ---------- */
function applyStatic(){
  document.documentElement.lang=st.lang==='pt'?'pt-BR':'en';
  document.title=L().title;
  $('toc').setAttribute('aria-label',L().navLabel);
  $('staff').setAttribute('aria-label',L().staffAria);
  document.querySelector('section.top').setAttribute('aria-label',L().secAria);
  document.querySelectorAll('[data-i]').forEach(el=>{const v=L()[el.dataset.i];if(typeof v==='string')el.innerHTML=v});
  $('gq').placeholder=L().search;
  $('lang-pt').setAttribute('aria-pressed',st.lang==='pt');$('lang-en').setAttribute('aria-pressed',st.lang==='en');
}
function render(){
  const tr=L(),k=st.k,cur=displayed(k),lcur=logical(k),pred=predLogical(k),consistent=same(cur,lcur);
  const d=diff(pred,lcur),up=st.dir==='cw'?7:5;
  drawCircle();
  $('keyname').innerHTML=`${keyName(cur)}<small>${sigShort(cur)==='0'?tr.none:tr.inSig(sigShort(cur))}</small>`;
  const sig=sigOf(cur),newL=consistent&&d&&d.to!==0?d.l:-1;
  drawStaff(cur,newL);
  $('sigtext').innerHTML=sig.list.length?tr.sig+sig.list.map(n=>n[0]===newL?`<span class="new">${nm(n)}</span>`:nm(n)).join(' '):tr.sigEmpty;
  let c=`<p class="move">${keyName(pred)}<span class="arrow">→</span>${keyName(lcur)}</p>`;
  c+=`<p><span class="pill">${st.dir==='cw'?tr.up5:tr.up4}</span></p>`;
  if(d){c+=`<p>${tr.change(nm([d.l,d.from]),nm([d.l,d.to]),d.deg,d.deg===7?tr.role7:tr.role4,keyName(lcur))}</p>`;
    c+=`<p class="rule">${st.dir==='cw'?tr.ruleCw:tr.ruleCcw}</p>`}
  if(!consistent)c+=`<p class="rule">${tr.enh(keyName(cur),keyName(lcur),nm(lcur))}</p>`;
  $('change').innerHTML=c;
  const sc=scaleOf(cur);let chk;
  if(sig.type>0)chk=tr.chkSharp(nm(sig.list[sig.list.length-1]),nm(cur));
  else if(sig.type<0&&sig.list.length>1)chk=tr.chkFlats(nm(sig.list[sig.list.length-2]),nm(cur));
  else if(sig.type<0)chk=tr.chkFlat1(nm(sig.list[0]),nm(cur));
  else chk=tr.chkNone(nm(cur));
  $('check').textContent=chk;

  /* jump */
  const s0=pcOf(pred),marks={};
  for(let i=0;i<=up;i++){const s=s0+i;
    if(i===0)marks[s]={fill:fillFor(s,'var(--k-start)','var(--k-startb)'),ink:fillFor(s,'var(--k-start-ink)','var(--k-startb-ink)'),label:'0',name:nm(pred)};
    else if(i===up)marks[s]={fill:'var(--k-tonic)',ink:'var(--k-tonic-ink)',label:i,name:nm(lcur)};
    else marks[s]={fill:fillFor(s,'var(--k-path)','var(--k-scaleb)'),ink:fillFor(s,'var(--k-path-ink)','var(--k-scaleb-ink)'),label:i}}
  if(d&&st.dir==='cw'){const s=s0+6;marks[s]={fill:fillFor(s,'var(--k-chg)','var(--k-chgb)'),ink:fillFor(s,'var(--k-chg-ink)','var(--k-chgb-ink)'),label:6,name:nm([d.l,d.to])}}
  drawKeys($('jump'),marks,null);
  $('jump').setAttribute('aria-label',`${nm(pred)} → ${nm(lcur)}`);
  $('jumpnow').textContent=`${nm(pred)} → ${nm(lcur)} · ${up} ${tr.steps}`;
  window._jump=[s0,s0+up];

  /* scale */
  const base=pcOf(cur),sm={},notes=OFF.map(o=>base+o).concat(base+12),stepTxt=[];
  const chIdx=consistent&&d?d.deg-1:-1;
  notes.forEach((s,i)=>{const n=sc[i%7],deg=(i%7)+1;let f,ink;
    if(i%7===0){f='var(--k-tonic)';ink='var(--k-tonic-ink)'}
    else if(i===chIdx){f=fillFor(s,'var(--k-chg)','var(--k-chgb)');ink=fillFor(s,'var(--k-chg-ink)','var(--k-chgb-ink)')}
    else if(n[1]!==0){f=fillFor(s,'var(--k-acc)','var(--k-accb)');ink=fillFor(s,'var(--k-acc-ink)','var(--k-accb-ink)')}
    else{f=fillFor(s,'var(--k-scale)','var(--k-scaleb)');ink=fillFor(s,'var(--k-scale-ink)','var(--k-scaleb-ink)')}
    sm[s]={fill:f,ink:ink,label:deg,name:nm(n)}});
  const Ls=layout(0,23);
  for(let i=0;i<7;i++){const a=notes[i],b=notes[i+1],w=b-a===2;stepTxt.push({x:((Ls.c(a)+Ls.c(b))/2).toFixed(1),t:w?tr.W:tr.H,h:!w})}
  drawKeys($('scale'),sm,stepTxt,{lay:Ls});
  renderFunc(cur);renderHinge(cur);renderOrigin();renderWindow(cur);renderField(cur);
  renderTetra(cur);renderNames(cur);renderInt(cur);renderTri(cur);renderProg(cur);renderCompose(cur);
  $('scale').setAttribute('aria-label',`${keyName(cur)}: ${sc.map(nm).join(' ')}`);
  $('scalenow').textContent=`${keyName(cur)} · ${sc.map(nm).join(' ')}`;
  window._scale=notes;

  $('dir-cw').setAttribute('aria-pressed',st.dir==='cw');$('dir-ccw').setAttribute('aria-pressed',st.dir==='ccw');
  $('nt-en').setAttribute('aria-pressed',st.nt==='en');$('nt-pt').setAttribute('aria-pressed',st.nt==='pt');
}

function go(k){const wasSame=((k%12)+12)%12===st.k;st.k=((k%12)+12)%12;
  if(st.k===6){if(wasSame)st.enh=st.enh==='Fs'?'Gb':'Fs';else st.enh=st.dir==='cw'?'Fs':'Gb'}
  render();save()}
$('circle').addEventListener('click',e=>{const g=e.target.closest('.node');if(g)go(+g.dataset.k)});
$('circle').addEventListener('keydown',e=>{const g=e.target.closest('.node');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const kk=g.dataset.k;go(+kk);setTimeout(()=>{const n=document.querySelector(`.node[data-k="${kk}"]`);n&&n.focus()},0)}});
$('next').onclick=()=>go(st.k+(st.dir==='cw'?1:-1));
$('prev').onclick=()=>go(st.k+(st.dir==='cw'?-1:1));
$('dir-cw').onclick=()=>{st.dir='cw';if(st.k===6)st.enh='Fs';render();save()};
$('dir-ccw').onclick=()=>{st.dir='ccw';if(st.k===6)st.enh='Gb';render();save()};
$('nt-en').onclick=()=>{st.nt='en';render();renderGloss();save()};
$('nt-pt').onclick=()=>{st.nt='pt';render();renderGloss();save()};
function setLang(l){st.lang=l;st.nt=l==='pt'?'pt':'en';applyStatic();render();renderGloss();save()}
$('lang-pt').onclick=()=>setLang('pt');
$('lang-en').onclick=()=>setLang('en');

/* ---------- sound ---------- */
let ac=null;
function tone(s,t0,dur,v){toneHz(261.63*Math.pow(2,s/12),t0,dur,v)}
function toneHz(f,t0,dur,v){const o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||0.22,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+dur+0.05)}
function audio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return true}catch(e){return false}}
$('play-jump').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,[a,b]=window._jump;tone(a,t,0.7);tone(b,t+0.6,0.7);tone(a,t+1.35,1.2);tone(b,t+1.35,1.2)};
let playTok=0;
const rer=()=>displayed(st.k);
function playChordAt(i){if(!audio())return;const P=window._prog,t=ac.currentTime+0.03;tone(P.roots[i]-12,t,1.1,0.15);P.vs[i].forEach(p=>tone(p,t,1.1,0.15))}
function playInt(){if(!audio())return;const t=ac.currentTime+0.05,[a,b]=window._int;tone(a,t,0.6);tone(b,t+0.55,0.6);tone(a,t+1.2,1.3,0.18);tone(b,t+1.2,1.3,0.18)}
$('play-int').onclick=playInt;
$('ivchips').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;st.ivl=+b.dataset.g;renderInt(rer());save()});
$('census').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;st.ivr=+b.dataset.r;renderInt(rer());save();playInt()});
$('play-tetra').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,a=window._tetra;a.forEach((s,i)=>tone(s,t+i*0.3+Math.floor(i/4)*0.35,0.45))};
$('play-tri').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,s=window._tri;tone(s,t,1.3);tone(s+6,t,1.3);tone(s,t+1.5,1.3);tone(s+7,t+1.5,1.3)};
$('pats').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;playTok++;st.pat=+b.dataset.p;st.pi=0;renderProg(rer());save()});
$('progchips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;playTok++;st.pi=+b.dataset.c;renderProg(rer());playChordAt(st.pi)});
$('pc-prev').onclick=()=>{playTok++;const n=PATS[st.pat||0].deg.length;st.pi=((st.pi||0)-1+n)%n;renderProg(rer());playChordAt(st.pi)};
$('pc-next').onclick=()=>{playTok++;const n=PATS[st.pat||0].deg.length;st.pi=((st.pi||0)+1)%n;renderProg(rer());playChordAt(st.pi)};
$('play-prog').onclick=()=>{if(!audio())return;const tok=++playTok,P=window._prog,D=1.0,t=ac.currentTime+0.08;
  P.vs.forEach((v,i)=>{tone(P.roots[i]-12,t+i*D,D*0.95,0.15);v.forEach(p=>tone(p,t+i*D,D*0.95,0.15));
    setTimeout(()=>{if(tok!==playTok)return;st.pi=i;renderProg(rer())},i*D*1000+80)})};
$('melchips').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;st.mel=+b.dataset.m;renderCompose(rer());save()});
$('harm').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b||!audio())return;
  const sc=scaleOf(rer()),d=+b.dataset.h,pcs=triad(sc,d).map(pcOf),mp=pcOf(sc[st.mel||0])+12,t=ac.currentTime+0.03;
  tone(pcs[0]-12,t,1.6,0.15);
  pcs.filter(p=>p!==mp%12).forEach(p=>{let x=p;while(x+12<mp)x+=12;while(x>=mp)x-=12;tone(x,t,1.6,0.14)});
  tone(mp,t,1.6,0.24)});
$('play-fifth').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,c=261.63,g=st.tune==='eq'?c*Math.pow(2,7/12):c*1.5;toneHz(c,t,0.8);toneHz(g,t+0.75,0.8);toneHz(c,t+1.6,1.8);toneHz(g,t+1.6,1.8)};
$('play-comma').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,c=261.63,bs=st.tune==='eq'?c:c*Math.pow(1.5,12)/128;toneHz(c,t,0.9);toneHz(bs,t+0.85,0.9);toneHz(c,t+1.8,2.6);toneHz(bs,t+1.8,2.6)};
$('play-chord').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,p=window._chord;p.forEach((s,i)=>tone(s,t+i*0.35,0.6));p.forEach(s=>tone(s,t+1.15,1.6))};
$('tune-pure').onclick=()=>{st.tune='pure';renderOrigin();save()};
$('tune-eq').onclick=()=>{st.tune='eq';renderOrigin();save()};
$('slide-r').onclick=()=>{st.dir='cw';go(st.k+1)};
$('slide-l').onclick=()=>{st.dir='ccw';go(st.k-1)};
['chips-scale','chips-win'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;st.deg=+b.dataset.d;renderField(displayed(st.k));save()}));
$('play-func').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,f=window._func;tone(f.lt,t,0.75);tone(f.c,t+0.7,1.3)};
$('play-hinge').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05,h=window._hinge;tone(h.n4,t,1);tone(h.n7,t,1);tone(h.n4-1,t+0.95,1.4);tone(h.n7+1,t+0.95,1.4)};
$('play-scale').onclick=()=>{if(!audio())return;const t=ac.currentTime+0.05;window._scale.forEach((s,i)=>tone(s,t+i*0.32,0.5))};

/* ---------- glossary: [EN term, EN alt, PT term, PT definition, EN definition] ---------- */
const G=[
 ['Half step','semitone','Semitom','A menor distância do teclado: de uma tecla para a vizinha imediata, branca ou preta. Mi–Fá e Si–Dó são semitons sem tecla preta no meio.','The smallest distance on the keyboard: from one key to the very next, white or black. E–F and B–C are half steps with no black key between them.'],
