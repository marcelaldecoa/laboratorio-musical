 ['Perfect fifth','P5','Quinta justa','7 semitons; cinco nomes de nota contando as pontas (Dó–Ré–Mi–Fá–Sol). É o passo do círculo no sentido horário.','7 half steps; five note names counting both ends (C–D–E–F–G). The clockwise step of the circle.'],
 ['Perfect fourth','P4','Quarta justa','5 semitons. É a inversão da quinta: 5 + 7 = 12. É o passo do círculo no sentido anti-horário.','5 half steps. The inversion of the fifth: 5 + 7 = 12. The counter-clockwise step of the circle.'],
 ['Octave','','Oitava','12 semitons: a mesma nota, uma volta acima. Por isso o círculo fecha em 12 passos.','12 half steps: the same note, one turn higher. That is why the circle closes after 12 steps.'],
 ['Pitch class','','Classe de altura','A nota sem considerar a oitava, como aritmética módulo 12. Como 7 e 12 não têm divisor comum, somar 7 percorre as 12 notas.','A note regardless of octave, as arithmetic modulo 12. Since 7 and 12 share no divisor, adding 7 visits all 12 pitch classes.'],
 ['Major scale','','Escala maior','Sete notas com a fórmula T T S T T T S, a partir da tônica.','Seven notes following W W H W W W H from the tonic.'],
 ['Tetrachord','','Tetracorde','Do grego tetra (quatro) + chordé (corda): um bloco de quatro notas que cobre uma quarta justa, como as quatro cordas da lira grega. A escala maior são dois tetracordes T T S unidos por um tom; o de cima de uma escala é o de baixo da próxima no círculo.','From Greek tetra (four) + chordé (string): a block of four notes spanning a perfect fourth, like the four strings of the Greek lyre. A major scale is two W W H tetrachords joined by a whole step; the upper one of a scale is the lower one of the next key on the circle.'],
 ['Perfect interval','','Intervalo justo','Uníssono, 4ª, 5ª e 8ª: as consonâncias perfeitas da teoria medieval (razões 1:1, 4:3, 3:2, 2:1). Têm um só tamanho natural na escala (exceto Fá–Si) e continuam justos quando invertidos.','Unison, 4th, 5th and octave: the perfect consonances of medieval theory (ratios 1:1, 4:3, 3:2, 2:1). They come in one natural size in the scale (except F–B) and stay perfect when inverted.'],
 ['Interval number','generic interval','Número do intervalo','Quantos nomes de nota o intervalo abrange, contando as duas pontas: Dó–Sol tem 5 nomes, é uma 5ª. Mede posições na pauta.','How many letter names the interval spans, counting both ends: C–G spans 5 names, a 5th. It measures staff positions.'],
 ['Interval quality','','Qualidade do intervalo','O tamanho exato em semitons: justa, maior, menor, aumentada ou diminuta. Duas 3ªs podem ter 4 semitons (maior) ou 3 (menor).','The exact size in half steps: perfect, major, minor, augmented or diminished. Two 3rds can have 4 half steps (major) or 3 (minor).'],
 ['Augmented, diminished','','Aumentado, diminuto','Um semitom acima da justa ou maior (aumentado), ou um semitom abaixo da justa ou menor (diminuto). Fá–Si é uma 4ª aumentada; Si–Fá, uma 5ª diminuta.','A half step above perfect or major (augmented), or a half step below perfect or minor (diminished). F–B is an augmented 4th; B–F, a diminished 5th.'],
 ['Compound interval','','Intervalo composto','Maior que uma oitava. A 9ª é uma 2ª uma oitava acima: 2 + 8 − 1, porque a oitava compartilha uma nota.','Larger than an octave. A 9th is a 2nd an octave up: 2 + 8 − 1, because the octave shares a note.'],
 ['Imperfect consonance','','Consonância imperfeita','Na teoria medieval, as 3ªs e 6ªs: agradáveis, mas menos estáveis que as consonâncias perfeitas (uníssono, 4ª, 5ª, 8ª).','In medieval theory, 3rds and 6ths: pleasant, but less stable than the perfect consonances (unison, 4th, 5th, octave).'],
 ['Inversion','','Inversão','Virar o intervalo: a nota de baixo sobe uma oitava. Os nomes somam 9 (5ª ↔ 4ª, 3ª ↔ 6ª) e os semitons somam 12.','Flipping an interval: the lower note goes up an octave. The names add up to 9 (5th ↔ 4th, 3rd ↔ 6th) and the half steps add up to 12.'],
 ['Supertonic','','Supertônica','O 2º grau, logo acima da tônica.','Degree 2, just above the tonic.'],
 ['Mediant','','Mediante','O 3º grau, no meio do caminho entre a tônica e a dominante.','Degree 3, halfway between the tonic and the dominant.'],
 ['Submediant','','Submediante','O 6º grau, no meio do caminho entre a tônica e a subdominante de baixo. Espelho da mediante.','Degree 6, halfway between the tonic and the lower dominant. The mediant’s mirror.'],
 ['Scale degree','','Grau','A posição de cada nota na escala, de 1 a 7.','The position of each note in the scale, from 1 to 7.'],
 ['Tonic','','Tônica','O 1º grau, o centro da tonalidade.','Degree 1, the center of the key.'],
 ['Subdominant','','Subdominante','O 4º grau (Fá em Dó maior). O nome quer dizer “dominante de baixo”: fica uma quinta abaixo da tônica, assim como a dominante fica uma quinta acima. No círculo é o vizinho anti-horário da tônica. Quando você anda no sentido horário, é ela que sobe meio tom e vira a sensível da nova tonalidade.','Degree 4 (F in C major). The name means “the lower dominant”: it sits a fifth below the tonic, just as the dominant sits a fifth above. On the circle it is the tonic’s counter-clockwise neighbor. When you move clockwise, it rises a half step and becomes the new key’s leading tone.'],
 ['Dominant','','Dominante','O 5º grau (Sol em Dó maior), uma quinta acima da tônica. Depois da tônica é a nota mais forte da tonalidade, e o acorde de dominante é o que puxa de volta para casa. No círculo é o vizinho horário da tônica: cada passo no sentido horário leva você para a dominante.','Degree 5 (G in C major), a fifth above the tonic. After the tonic it is the strongest note in the key, and the dominant chord is what pulls the music back home. On the circle it is the tonic’s clockwise neighbor: every clockwise step takes you to the dominant.'],
 ['Leading tone','','Sensível','O 7º grau (Si em Dó maior), um semitom abaixo da tônica. Toque a escala e pare nela: o ouvido pede a tônica. Quando você anda no sentido anti-horário, é ela que desce meio tom e vira a subdominante da nova tonalidade.','Degree 7 (B in C major), a half step below the tonic. Play the scale and stop on it: your ear asks for the tonic. When you move counter-clockwise, it drops a half step and becomes the new key’s subdominant.'],
 ['Tritone','','Trítono','Do latim tri + tonus: três tons inteiros, 6 semitons, exatamente meia oitava. É o único intervalo que, invertido, continua igual. Na escala maior só existe um, entre o 4º e o 7º graus (Fá–Si em Dó maior): as duas notas que mudam no círculo e o coração do acorde dominante. Ele é instável e resolve com cada nota andando meio tom (Fá→Mi, Si→Dó).','From Latin tri + tonus: three whole steps, 6 half steps, exactly half an octave. The only interval that stays the same when inverted. A major scale has only one, between degrees 4 and 7 (F–B in C major): the two notes that change on the circle and the core of the dominant chord. It is unstable and resolves with each note moving a half step (F→E, B→C).'],
 ['Key','tonality','Tonalidade','O conjunto de notas e a tônica em torno das quais a música se organiza.','The set of notes, and the tonic, around which the music is organized.'],
 ['Key signature','','Armadura de clave','Os sustenidos ou bemóis no começo da pauta. É a lista de notas que a fórmula obrigou a alterar.','The sharps or flats at the start of the staff: the notes the formula forced you to alter.'],
 ['Accidental','','Acidente','Símbolo que altera uma nota: sustenido, bemol ou bequadro.','A sign that alters a note: sharp, flat or natural.'],
 ['Sharp','♯','Sustenido','Sobe a nota um semitom.','Raises a note by a half step.'],
 ['Flat','♭','Bemol','Desce a nota um semitom.','Lowers a note by a half step.'],
 ['Natural','♮','Bequadro','Cancela um sustenido ou bemol.','Cancels a sharp or flat.'],
 ['Order of sharps','F C G D A E B','Ordem dos sustenidos','Cada sustenido novo é a sensível da tonalidade seguinte, então eles entram em quintas a partir de Fá.','Each new sharp is the leading tone of the next key, so sharps enter in fifths starting from F.'],
 ['Order of flats','B E A D G C F','Ordem dos bemóis','A ordem dos sustenidos ao contrário, porque a quarta é a quinta invertida. Cada bemol novo é o 4º grau da tonalidade seguinte.','The order of sharps reversed, because a fourth is an inverted fifth. Each new flat is degree 4 of the next key.'],
 ['Enharmonic','','Enarmônico','Mesma tecla, nomes diferentes: Fá♯ = Sol♭, Mi♯ = Fá, Dó♭ = Si. Fá♯ maior e Sol♭ maior são tonalidades enarmônicas.','Same key, different names: F♯ = G♭, E♯ = F, C♭ = B. F♯ major and G♭ major are enharmonic keys.'],
 ['Circle of fifths','','Círculo das quintas','As 12 tonalidades em passos de quinta justa no sentido horário. Vizinhos diferem em uma única nota.','The 12 keys in perfect-fifth steps, clockwise. Neighbors differ by a single note.'],
 ['Circle of fourths','','Círculo das quartas','O mesmo círculo lido no sentido anti-horário, em passos de quarta justa.','The same circle read counter-clockwise, in perfect-fourth steps.'],
 ['Clockwise','counter-clockwise','Horário / anti-horário','Horário soma sustenidos ou tira bemóis; anti-horário soma bemóis ou tira sustenidos.','Clockwise adds sharps or removes flats; counter-clockwise adds flats or removes sharps.'],
 ['Diatonic','','Diatônico','As notas que pertencem à escala da tonalidade.','The notes that belong to the key\'s scale.'],
 ['Chromatic','','Cromático','Nota ou movimento fora da escala; a escala cromática tem os 12 semitons.','A note or motion outside the scale; the chromatic scale has all 12 half steps.'],
 ['Treble clef','G clef','Clave de sol','A clave da pauta de cima no piano; a espiral marca a linha do Sol.','The clef of the piano\'s upper staff; its curl marks the G line.'],
 ['Fingering','','Dedilhado','Os números dos dedos (1 = polegar). Em Dó maior, mão direita: 1-2-3-1-2-3-4-5.','Finger numbers (1 = thumb). C major, right hand: 1-2-3-1-2-3-4-5.'],
 ['Thumb under','','Passagem do polegar','O polegar passa por baixo da mão para continuar a escala sem saltos.','The thumb passes under the hand so the scale continues without a jump.'],
 ['Pythagorean comma','','Coma pitagórica','A sobra de cerca de 23,5 cents quando se comparam 12 quintas puras (3:2) com 7 oitavas. É por isso que, na afinação pura, o círculo vira espiral.','The roughly 23.5-cent surplus when 12 pure fifths (3:2) are compared with 7 octaves. It is why, in pure tuning, the circle becomes a spiral.'],
 ['Cent','','Cent','Um centésimo de semitom temperado. A oitava tem 1200 cents.','One hundredth of an equal-tempered half step. An octave has 1200 cents.'],
 ['Equal temperament','12-TET','Temperamento igual','Divide a oitava em 12 semitons idênticos. Cada quinta fica com 700 cents, um pouco menor que a pura (701,96), e o círculo fecha.','Divides the octave into 12 identical half steps. Each fifth becomes 700 cents, slightly narrower than pure (701.96), and the circle closes.'],
 ['Line of fifths','','Linha de quintas','O círculo esticado numa linha. Uma tonalidade maior ocupa 7 casas seguidas: a da esquerda é a subdominante e a da direita, a sensível.','The circle stretched into a line. A major key fills 7 consecutive slots: the leftmost is the subdominant and the rightmost the leading tone.'],
 ['Root','','Fundamental','A nota que dá nome ao acorde, a base da pilha de terças.','The note that names the chord, the bottom of the stack of thirds.'],
 ['Triad','','Tríade','Acorde de três notas empilhadas em terças: fundamental, terça e quinta.','A three-note chord stacked in thirds: root, third and fifth.'],
 ['Major third','M3','Terça maior','4 semitons. Na linha de quintas, 4 casas à direita (Dó → Sol → Ré → Lá → Mi).','4 half steps. On the line of fifths, 4 slots to the right (C → G → D → A → E).'],
 ['Minor third','m3','Terça menor','3 semitons. Na linha de quintas, 3 casas à esquerda (Lá → Ré → Sol → Dó).','3 half steps. On the line of fifths, 3 slots to the left (A → D → G → C).'],
 ['Major, minor, diminished','triad qualities','Maior, menor, diminuto','Maior = 3ª maior + 3ª menor (4 + 3). Menor = 3ª menor + 3ª maior (3 + 4). Diminuto = duas 3ªs menores (3 + 3), com quinta diminuta de 6 semitons.','Major = major third + minor third (4 + 3). Minor = minor third + major third (3 + 4). Diminished = two minor thirds (3 + 3), with a 6-half-step diminished fifth.'],
 ['Diatonic chords','harmonic field','Campo harmônico','Os 7 acordes formados empilhando terças só com notas da escala. Em toda tonalidade maior: I ii iii IV V vi vii°.','The 7 chords built by stacking thirds using only scale notes. In every major key: I ii iii IV V vi vii°.'],
 ['Harmonic function','T · SD · D','Função harmônica','O papel do acorde na história: tônica (repouso: I, vi, iii), subdominante (afastamento: IV, ii) e dominante (tensão: V, vii°). Acordes da mesma função têm duas notas em comum.','A chord’s role in the story: tonic (rest: I, vi, iii), subdominant (departure: IV, ii) and dominant (tension: V, vii°). Chords with the same function share two notes.'],
 ['Roman numerals','','Algarismos romanos','Nomeiam os acordes pelo grau: maiúsculo = maior (I, IV, V), minúsculo = menor (ii, iii, vi), ° = diminuto (vii°). Servem em qualquer tonalidade.','Name chords by degree: uppercase = major (I, IV, V), lowercase = minor (ii, iii, vi), ° = diminished (vii°). They work in any key.'],
 ['Progression','','Progressão','Uma sequência de acordes. A lógica dela vem das funções (T → SD → D → T) e do movimento das fundamentais.','A sequence of chords. Its logic comes from functions (T → SD → D → T) and from how the roots move.'],
 ['Cadence','','Cadência','O final de uma frase harmônica, como a pontuação de um texto.','The ending of a harmonic phrase, like punctuation in a sentence.'],
 ['Authentic cadence','perfect cadence','Cadência perfeita','V → I. O ponto final: a sensível sobe para a tônica e o trítono se resolve.','V → I. The period: the leading tone rises to the tonic and the tritone resolves.'],
 ['Plagal cadence','Amen cadence','Cadência plagal','IV → I, o “Amém” dos hinos. Repouso sem a tensão da sensível.','IV → I, the “Amen” of hymns. Rest without the leading tone’s tension.'],
 ['Half cadence','','Cadência suspensiva','Frase que termina no V. Soa como uma vírgula ou uma pergunta.','A phrase ending on V. It sounds like a comma or a question.'],
 ['Deceptive cadence','','Cadência de engano','V → vi. O ouvido espera o I e recebe o vi, que tem duas notas em comum com ele.','V → vi. The ear expects I and gets vi, which shares two notes with it.'],
 ['Voice leading','','Condução de vozes','Ligar acordes movendo cada voz o mínimo possível: notas comuns ficam, as outras andam por tom ou semitom.','Connecting chords by moving each voice as little as possible: common tones stay, the others move by step.'],
 ['Common tone','','Nota comum','Nota presente em dois acordes seguidos. Quanto mais notas comuns, mais suave a passagem.','A note shared by two consecutive chords. The more common tones, the smoother the change.'],
 ['Harmonic rhythm','','Ritmo harmônico','A frequência com que os acordes mudam. Um por compasso é o padrão; acelerar perto da cadência cria impulso.','How often the chords change. One per bar is the default; speeding up near the cadence builds momentum.'],
 ['Relative minor','','Relativa menor','A escala menor com a mesma armadura, três semitons abaixo (Lá menor para Dó maior). Tema da aula 3.','The minor scale with the same key signature, three half steps below (A minor for C major). Topic of lesson 3.']
];
function renderGloss(){
  const tr=L(),q=($('gq').value||'').trim().toLowerCase();
  const items=G.filter(g=>!q||(st.lang==='pt'?[g[2],g[3]]:[g[0],g[1],g[4]]).join(' ').toLowerCase().includes(q));
  $('gloss').innerHTML=items.length?items.map(g=>{
    const [en,alt,pt,dpt,den]=g;
    const sym=/^[♯♭♮]$/.test(alt)?alt:'';
    const dt=st.lang==='pt'
      ?`${pt}${sym?` <span class="alt">${sym}</span>`:''}`
      :`${en}${alt?` <span class="alt">${alt}</span>`:''}`;
    return `<div class="gi"><dt>${dt}</dt><dd>${st.lang==='pt'?dpt:den}</dd></div>`}).join(''):`<p class="empty">${tr.empty}</p>`;
  $('gcount').textContent=tr.count(items.length,G.length);
}
$('gq').addEventListener('input',renderGloss);

try{const s=JSON.parse(localStorage.getItem('cof-lab')||'null');if(s&&typeof s.k==='number'){Object.assign(st,s);if(!T[st.lang])st.lang='pt'}}catch(e){}
applyStatic();render();renderGloss();
</script>
